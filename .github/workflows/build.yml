name: build

# tag 推送时在 Windows + macOS 两个 runner 上构建 onedir 二进制，压缩为 zip 附加到 GitHub Release。
# onedir（非 onefile）：免解压、启动快、杀毒误报低；分发形态是目录 zip。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            zip: protein-lab-windows.zip
            pkg_shell: pwsh
            pkg_cmd: cd dist && Compress-Archive -Path protein_lab -DestinationPath protein-lab-windows.zip
          - os: macos-latest
            zip: protein-lab-macos.zip
            pkg_shell: bash
            # 用原生 zip 保留执行权限（macOS 二进制解压后仍需可执行）
            pkg_cmd: cd dist && zip -r protein-lab-macos.zip protein_lab
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'          # 与本地 venv 一致，本地可复现 CI 产物

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller protein_lab.spec --noconfirm

      - name: Package onedir to zip
        shell: ${{ matrix.pkg_shell }}
        run: ${{ matrix.pkg_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.zip }}
