name: build

# tag 推送时在 Windows + macOS 两个 runner 上构建 onedir 二进制，压缩为 zip 附加到 GitHub Release。
# onedir（非 onefile）：免解压、启动快、杀毒误报低；分发形态是目录 zip。
permissions:
  contents: write   # 创建 Release + 上传资产需要（否则 softprops/action-gh-release 报 Resource not accessible）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            zip: protein-lab-windows.zip
          - os: macos-latest
            zip: protein-lab-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'          # 与本地 venv 一致，本地可复现 CI 产物

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-build.txt

      # 回归测试：models 层 + BLI/酶活模块。MPLBACKEND=Agg 确保无头环境绘图不弹窗。
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python test_models.py && python test_bli.py && python test_akta.py

      - name: Build with PyInstaller
        run: pyinstaller protein_lab.spec --noconfirm

      # 注意：shell 字段不能用 ${{ matrix.* }}（GitHub 规范限制），固定 pwsh（双平台预装）。
      # Windows 用 Compress-Archive；macOS 用原生 zip 以保留二进制执行位。
      - name: Package onedir to zip
        shell: pwsh
        env:
          ZIP_NAME: ${{ matrix.zip }}
        run: |
          cd dist
          if ($env:RUNNER_OS -eq 'Windows') { Compress-Archive -Path protein_lab -DestinationPath $env:ZIP_NAME }
          else { & zip -r $env:ZIP_NAME protein_lab }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.zip }}
