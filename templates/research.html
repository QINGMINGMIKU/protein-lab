{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <p class="page-kicker" data-i18n="nav.product">BDA Workbench</p>
    <h1 data-i18n="research.title">Research Trace</h1>
  </div>
  <div class="page-actions">
    <span class="research-hint" style="align-self:center;color:var(--graphite);font-size:13px" data-i18n="research.hint">
      Goal → experiment → conclusion → next goal
    </span>
    <button class="btn btn-primary" onclick="researchAddRoot()"><span data-i18n="research.add_root">New root goal</span></button>
  </div>
</div>

<div class="toolbar" style="gap:8px">
  <input type="text" id="researchQuery" data-i18n-placeholder="research.filter" placeholder="Filter titles, tags, or experiment titles…"
         oninput="researchRender()" style="flex:1;min-width:200px">
  <select id="researchTagFilter" onchange="researchRender()">
    <option value="" data-i18n-option="research.all_tags">All tags</option>
  </select>
  <select id="researchProteinFilter" onchange="researchRender()">
    <option value="" data-i18n-option="research.all_proteins">All proteins</option>
  </select>
  <button class="btn btn-sm btn-outline" onclick="researchRender(true)" data-i18n="common.reload">Reload</button>
</div>

<div id="researchChain" class="research-chain hidden"></div>

<div id="researchFlowBack" class="research-flow-back hidden">
  <button class="btn btn-sm btn-outline" onclick="researchBackToList()"><span data-i18n="research.back_list">Root goal list</span></button>
  <span id="researchFlowBackTitle" class="research-flow-back-title"></span>
</div>

<div class="res-layout">
  <div id="researchFlow" class="res-flow-container"></div>
  <aside id="researchDetail" class="panel hidden res-detail-side">
    <div class="panel-header">
      <h2 id="researchDetailTitle"></h2>
      <button class="btn btn-sm btn-icon" data-drawer-close onclick="researchCloseDetail()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div id="researchDetailContent"></div>
  </aside>
</div>
<div id="researchEmpty" class="empty-hint hidden">
  <span data-i18n="research.empty">No research nodes yet.</span><br>
  <button class="btn btn-primary" onclick="researchAddRoot()" style="margin-top:10px" data-i18n="research.empty_start">Start: add a root goal</button>
</div>

<div id="researchModal" class="modal hidden">
  <div class="modal-box modal-wide">
    <div class="modal-header">
      <h3 id="researchModalTitle" data-i18n="research.modal_title">Research node</h3>
      <button class="btn btn-sm btn-icon" onclick="researchCloseModal()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <form id="researchForm" onsubmit="researchSave(event)">
      <input type="hidden" id="researchNodeId">
      <input type="hidden" id="researchParentId">
      <label><span data-i18n="research.type">Type</span>
        <select id="researchNodeType">
          <option value="goal" data-i18n-option="node.goal">Goal</option>
          <option value="experiment" data-i18n-option="node.experiment">Experiment</option>
          <option value="conclusion" data-i18n-option="node.conclusion">Conclusion</option>
        </select>
      </label>
      <label><span data-i18n="research.field_title">Title</span> <input type="text" id="researchTitle" required data-i18n-placeholder="research.title_ph" placeholder="One line: goal / experiment / conclusion"></label>
      <label><span data-i18n="research.field_detail">Detail</span> <textarea id="researchDetailTxt" rows="3" data-i18n-placeholder="research.detail_ph" placeholder="Optional notes"></textarea></label>
      <label><span data-i18n="research.field_tag">Tags</span> <input type="text" id="researchTag" data-i18n-placeholder="research.tag_ph" placeholder="Comma-separated, e.g. stability, TIM"></label>
      <label><span data-i18n="research.field_exp">Linked experiment (leave empty = planned)</span>
        <div class="research-exp-picker">
          <input type="text" id="researchExpSearch" data-i18n-placeholder="research.exp_search" placeholder="Search experiment titles…" oninput="researchExpFilter()">
          <select id="researchExpSel">
            <option value="" data-i18n-option="research.exp_placeholder">Planned (not archived)</option>
          </select>
        </div>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-weight:500;margin-top:4px;flex-direction:row">
        <input type="checkbox" id="researchFreeAttach" style="width:auto">
        <span data-i18n="research.free_attach">Free attach (bypass whitelist)</span>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="common.save">Save</button>
        <button type="button" class="btn btn-outline" onclick="researchCloseModal()" data-i18n="common.cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
