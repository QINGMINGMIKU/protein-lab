{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h1 data-i18n="proteins.title">Protein Library</h1>
  <div class="page-actions">
    <button class="btn btn-outline" onclick="refreshAllProteins()"><span data-i18n="proteins.refresh">Recalculate all</span></button>
    <button class="btn btn-primary" onclick="showAddModal()"><span data-i18n="proteins.add">Add protein</span></button>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="searchBox" data-i18n-placeholder="proteins.search" placeholder="Search name or tags…" oninput="loadProteins()">
  <button class="btn btn-outline" onclick="showImportModal()"><span data-i18n="proteins.import">Import FASTA</span></button>
</div>
<div id="tagFilterBar" class="tag-filter-bar" style="margin-bottom:8px"></div>

<div id="bulkBar" class="bulk-bar hidden">
  <span class="bulk-count" id="bulkCount">Selected 0</span>
  <button class="btn btn-sm btn-danger" onclick="batchDeleteProteins()"><span data-i18n="proteins.delete_selected">Delete selected</span></button>
  <button class="btn btn-sm btn-outline" onclick="batchEditTags()"><span data-i18n="proteins.edit_tags">Edit tags</span></button>
  <button class="btn btn-sm btn-outline" onclick="deleteAllProteins()"><span data-i18n="proteins.delete_all">Delete all</span></button>
  <button class="btn btn-sm" onclick="clearSelection()"><span data-i18n="proteins.clear_sel">Clear selection</span></button>
</div>

<div class="table-scroll desktop-table">
<table id="proteinTable" class="datatable">
  <thead>
    <tr>
      <th style="width:36px"><input type="checkbox" id="selectAllProteins" onchange="toggleSelectAllProteins(this)" data-i18n-title="proteins.select_all" title="Select all"></th>
      <th data-i18n="proteins.col_name">Name</th>
      <th onclick="sortProteinTable('mw')" style="cursor:pointer"><span data-i18n="proteins.col_mw">MW (Da)</span> <span id="sortMwInd" class="sort-ind"></span></th>
      <th onclick="sortProteinTable('ext_ox')" style="cursor:pointer"><span data-i18n="proteins.col_ext">ε_ox</span> <span id="sortExtInd" class="sort-ind"></span></th>
      <th data-i18n="proteins.col_abs">Abs[0.1%]</th>
      <th data-i18n="proteins.col_tags">Tags</th>
      <th data-i18n="proteins.col_seq">Sequence</th>
      <th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>
<div id="proteinList" class="record-list"></div>

<div id="detailPanel" class="panel hidden">
  <div class="panel-header">
    <h2 id="detailName"></h2>
    <div class="page-actions">
      <button class="btn btn-sm btn-primary" id="detailCreateExpBtn" onclick="createExpFromProtein()"><span data-i18n="proteins.create_exp">New experiment</span></button>
      <button class="btn btn-sm btn-icon" data-drawer-close onclick="closeDetail()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>
  <div id="detailContent"></div>
</div>

<div id="addModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 data-i18n="proteins.add_title">Add protein</h3>
      <button class="btn btn-sm btn-icon" onclick="closeAddModal()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <form id="addForm" onsubmit="addProtein(event)">
      <label><span data-i18n="proteins.name">Name</span> <input type="text" name="name" required data-i18n-placeholder="proteins.name_ph" placeholder="e.g. TIM-WT"></label>
      <label><span data-i18n="proteins.sequence">Sequence</span> <textarea name="sequence" required rows="4" data-i18n-placeholder="proteins.seq_ph" placeholder="Single-letter amino acid sequence"></textarea></label>
      <label><span data-i18n="proteins.tags">Tags</span> <span style="font-weight:400;color:var(--graphite)" data-i18n="proteins.tags_hint">(Enter to add)</span>
        <div class="tag-input" id="addTagInput">
          <input type="text" data-i18n-placeholder="proteins.tag_ph" placeholder="Type then Enter" onkeydown="handleTagKey(event, 'addTagInput')">
        </div>
        <input type="hidden" name="tag" id="addTagHidden">
      </label>
      <label><span data-i18n="proteins.notes">Notes</span> <input type="text" name="notes"></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="proteins.submit_add">Add</button>
        <button type="button" class="btn btn-outline" onclick="closeAddModal()" data-i18n="common.cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="importModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 data-i18n="proteins.import_title">Batch FASTA import</h3>
      <button class="btn btn-sm btn-icon" onclick="closeImportModal()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <form id="importForm" onsubmit="importFasta(event)">
      <label><span data-i18n="proteins.upload_file">Upload file</span> <input type="file" id="fastaFile" accept=".fasta,.fa,.txt" onchange="loadFastaFile()"></label>
      <label><span data-i18n="proteins.or_paste">Or paste FASTA text</span> <textarea name="fasta" required rows="10" placeholder=">protein1&#10;MGHHHHHHSSG..."></textarea></label>
      <label><span data-i18n="proteins.shared_tag">Shared tag</span> <input type="text" name="tag"></label>
      <label><span data-i18n="proteins.shared_notes">Shared notes</span> <input type="text" name="notes"></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="proteins.import_go">Import</button>
        <button type="button" class="btn btn-outline" onclick="closeImportModal()" data-i18n="common.cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="batchTagModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 data-i18n="proteins.batch_title">Batch edit tags</h3>
      <button class="btn btn-sm btn-icon" onclick="closeBatchTagModal()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <p style="font-size:13px;color:var(--graphite);margin-bottom:12px"><span data-i18n="proteins.batch_apply_n">Will apply to {n} selected proteins</span> <b id="batchTagCount">0</b></p>
    <label><span data-i18n="proteins.add_tags">Add tags</span> <span data-i18n="proteins.add_tags_hint">(Enter to add; existing tags stay)</span>
      <div class="tag-input" id="batchTagAddInput">
        <input type="text" data-i18n-placeholder="proteins.tag_ph" placeholder="Type then Enter" onkeydown="handleTagKey(event, 'batchTagAddInput')">
      </div>
      <input type="hidden" id="batchTagAddHidden">
    </label>
    <label><span data-i18n="proteins.remove_tags">Remove tags</span> <span data-i18n="proteins.remove_tags_hint">(Enter tags to remove)</span>
      <div class="tag-input" id="batchTagRemoveInput">
        <input type="text" data-i18n-placeholder="proteins.tag_ph" placeholder="Type then Enter" onkeydown="handleTagKey(event, 'batchTagRemoveInput')">
      </div>
      <input type="hidden" id="batchTagRemoveHidden">
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="applyBatchTags()" data-i18n="proteins.apply">Apply</button>
      <button class="btn btn-outline" onclick="closeBatchTagModal()" data-i18n="common.cancel">Cancel</button>
    </div>
  </div>
</div>

{% endblock %}
