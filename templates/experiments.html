{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h1 data-i18n="archive.title">Evidence Archive</h1>
  <div class="page-actions">
    <a class="btn btn-outline" href="/api/experiments/export" id="exportBtn"><span data-i18n="archive.export_all">Export all</span></a>
    <button class="btn btn-primary" onclick="showExpAddModal()"><span data-i18n="archive.new">New experiment</span></button>
  </div>
</div>

<div class="toolbar">
  <select id="expTypeFilter" onchange="loadExperiments()">
    <option value="" data-i18n-option="archive.all_types">All types</option>
    {% for t in exp_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
  </select>
</div>

<div id="expBulkBar" class="bulk-bar hidden">
  <span class="bulk-count" id="expBulkCount">Selected 0</span>
  <button class="btn btn-sm btn-danger" onclick="batchDeleteExperiments()"><span data-i18n="archive.delete_selected">Delete selected</span></button>
  <button class="btn btn-sm btn-outline" onclick="deleteAllExperiments()"><span data-i18n="archive.delete_all">Delete all</span></button>
  <button class="btn btn-sm" onclick="clearExpSelection()"><span data-i18n="archive.clear_sel">Clear selection</span></button>
</div>

<div class="table-scroll desktop-table">
<table id="expTable" class="datatable">
  <thead>
    <tr>
      <th style="width:36px"><input type="checkbox" id="selectAllExps" onchange="toggleSelectAllExps(this)" data-i18n-title="proteins.select_all" title="Select all"></th>
      <th style="width:115px" data-i18n="archive.col_date">Date</th>
      <th data-i18n="archive.col_title">Title</th>
      <th style="width:120px" data-i18n="archive.col_type">Type</th>
      <th data-i18n="archive.col_protein">Proteins</th>
      <th data-i18n="archive.col_notes">Notes</th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>
<div id="expList" class="record-list"></div>

<div id="expDetailPanel" class="panel hidden">
  <div class="panel-header">
    <h2 id="expDetailTitle"></h2>
    <button class="btn btn-sm btn-icon" onclick="closeExpDetail()" data-i18n-aria="common.close">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
  <div id="expDetailContent"></div>
</div>

<div id="expModal" class="modal hidden">
  <div class="modal-box modal-wide">
    <div class="modal-header">
      <h3 id="expModalTitle" data-i18n="archive.new">New experiment</h3>
      <button class="btn btn-sm btn-icon" onclick="closeExpModal()" data-i18n-aria="common.close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <form id="expForm" onsubmit="saveExperiment(event)">
      <label><span data-i18n="archive.field_title">Title</span> <input type="text" name="title" id="expTitle" required></label>
      <div class="form-row">
        <label><span data-i18n="archive.field_type">Type</span>
          <select name="exp_type" id="expType" required>
            <option value="" data-i18n-option="archive.choose">-- choose --</option>
            {% for t in exp_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
          </select>
        </label>
        <label><span data-i18n="archive.field_date">Date</span> <input type="date" name="date" id="expDate"></label>
      </div>
      <label><span data-i18n="archive.proteins_multi">Linked proteins</span> <span style="font-weight:400;color:var(--graphite)" data-i18n="archive.multi">(multi-select)</span>
        <div id="proteinCheckboxes" class="checkbox-group"></div>
      </label>
      <label><span data-i18n="archive.params_json">Parameters (JSON)</span> <textarea name="params" id="expParams" rows="3" placeholder='{"buffer":"PBS","temp":"25°C"}'></textarea></label>
      <label><span data-i18n="archive.results_json">Results (JSON)</span> <textarea name="results" id="expResults" rows="3" placeholder='{"KD":"1.2e-7"}'></textarea></label>
      <label><span data-i18n="archive.notes">Notes</span> <input type="text" name="notes" id="expNotes"></label>
      <label><span data-i18n="archive.goal">Which research goal?</span><span style="font-weight:400;color:var(--graphite)" data-i18n="archive.goal_hint">(optional; leave empty to attach later)</span>
        <div class="form-row">
          <select id="expGoalSel"><option value="" data-i18n-option="archive.no_goal">-- do not attach --</option></select>
          <input type="text" id="expNewGoal" data-i18n-placeholder="archive.new_goal_ph" placeholder="Or type a new goal title (created as a root goal)" style="flex:1">
        </div>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="common.save">Save</button>
        <button type="button" class="btn btn-outline" onclick="closeExpModal()" data-i18n="common.cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
